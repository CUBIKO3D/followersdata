name: Extraer Seguidores Instagram

on:
  schedule:
    # 07:00 AM UTC todos los días
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutar el script manualmente desde GitHub para probarlo

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

- name: Ejecutar script de Python
            env:
              SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
              SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
              INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
              INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
            run: python main.py
